 <title>Descubra seu Signo Zodiacal</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a0a14;
      --card: #2a1220;
      --accent: #f472b6;
      --accent2: #ec4899;
      --text: #fce7f3;
      --muted: #f9a8d4;
      --border: rgba(244, 114, 182, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(244, 114, 182, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(236, 72, 153, 0.2), transparent);
    }

    .container { width: 100%; max-width: 500px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(236, 72, 153, 0.25);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f9a8d4, #ec4899, #f472b6);
    }

    .header { text-align: center; margin-bottom: 1.75rem; }

    .stars {
      font-size: 1.8rem;
      letter-spacing: 0.4rem;
      margin-bottom: 0.6rem;
      color: #f9a8d4;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fbcfe8, #f472b6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    input[type="date"] {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #1f0d18;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      margin-bottom: 1.1rem;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.25);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8) sepia(1) saturate(5) hue-rotate(300deg);
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.45);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(236, 72, 153, 0.55);
    }

    #resultado {
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      display: none;
    }

    #resultado.ativo {
      display: block;
      animation: aparecer 0.4s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .resultado-header { text-align: center; margin-bottom: 1.25rem; }

    .glyph {
      font-size: 3.8rem;
      line-height: 1;
      margin-bottom: 0.3rem;
      filter: drop-shadow(0 0 18px rgba(244, 114, 182, 0.5));
    }

    .resultado-header h2 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fbcfe8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }

    .periodo { color: var(--muted); font-size: 0.92rem; }

    .data-nasc {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.35rem;
    }

    .badge {
      background: rgba(244, 114, 182, 0.15);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: #f9a8d4;
    }

    .section { margin-bottom: 1.25rem; }

    .section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .section p {
      color: var(--text);
      line-height: 1.65;
      font-size: 0.93rem;
      font-weight: 300;
    }

    .traits {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.3rem;
    }

    .trait {
      background: #1f0d18;
      border-radius: 8px;
      padding: 0.3rem 0.65rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .fracos {
      background: rgba(244, 114, 182, 0.08);
      border-left: 3px solid #f472b6;
      padding: 0.75rem 1rem;
      border-radius: 0 10px 10px 0;
    }

    .erro {
      text-align: center;
      color: #fda4af;
      font-size: 0.95rem;
      padding: 1rem 0;
    }

    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="stars">✦ ✧ ✦</div>
        <h1>Descubra seu Signo</h1>
        <p class="subtitle">Coloque sua data de nascimento e descubra as principais características do seu signo zodiacal.</p>
      </div>

      <div>
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" required>
        <button type="button" id="btnRevelar">Revelar meu signo</button>
      </div>

      <div id="resultado"></div>

      <p class="footer">Astrologia ocidental • Signo solar</p>
    </div>
  </div>

  <script>
    const signos = {
      aries: {
        nome: "Áries", glifo: "♈", periodo: "21 de março a 19 de abril",
        elemento: "Fogo", modalidade: "Cardinal", planeta: "Marte",
        descricao: "Áries é o primeiro signo do zodíaco e representa o início, a coragem e a iniciativa. Pessoas de Áries são energéticas, diretas e gostam de liderar. Possuem espírito competitivo e não têm medo de desafios.",
        caracteristicas: ["Corajoso", "Impulsivo", "Líder", "Dinâmico", "Independente", "Entusiasta"],
        pontosFortes: "Determinação, honestidade e capacidade de motivar os outros.",
        pontosFracos: "Pode ser impaciente, temperamental e pouco diplomático. Às vezes age sem pensar nas consequências e tem dificuldade em aceitar críticas."
      },
      touro: {
        nome: "Touro", glifo: "♉", periodo: "20 de abril a 20 de maio",
        elemento: "Terra", modalidade: "Fixo", planeta: "Vênus",
        descricao: "Touro valoriza a estabilidade, o conforto e os prazeres sensoriais. São pessoas práticas, leais e persistentes, que constroem com paciência e apreciam a beleza e a segurança material.",
        caracteristicas: ["Paciente", "Sensual", "Confiável", "Teimoso", "Prático", "Leal"],
        pontosFortes: "Constância, bom gosto e capacidade de criar segurança.",
        pontosFracos: "Resistência excessiva a mudanças e tendência à possessividade. Pode ser teimoso demais e demorar para sair da zona de conforto."
      },
      gemeos: {
        nome: "Gêmeos", glifo: "♊", periodo: "21 de maio a 20 de junho",
        elemento: "Ar", modalidade: "Mutável", planeta: "Mercúrio",
        descricao: "Gêmeos é o signo da comunicação e da curiosidade. Pessoas de Gêmeos são versáteis, inteligentes e sociáveis. Adoram aprender, conversar e explorar diferentes ideias e ambientes.",
        caracteristicas: ["Comunicativo", "Curioso", "Versátil", "Inteligente", "Sociável", "Ágil"],
        pontosFortes: "Adaptabilidade, raciocínio rápido e facilidade de expressão.",
        pontosFracos: "Pode ser disperso, superficial ou indeciso. Tem dificuldade em se concentrar em uma coisa só e às vezes fala mais do que age."
      },
      cancer: {
        nome: "Câncer", glifo: "♋", periodo: "21 de junho a 22 de julho",
        elemento: "Água", modalidade: "Cardinal", planeta: "Lua",
        descricao: "Câncer é profundamente ligado às emoções, à família e ao sentimento de pertencimento. São pessoas intuitivas, protetoras e empáticas, que valorizam laços afetivos e o conforto do lar.",
        caracteristicas: ["Emotivo", "Protetor", "Intuitivo", "Sensível", "Acolhedor", "Leal"],
        pontosFortes: "Empatia, memória afetiva e capacidade de cuidar dos outros.",
        pontosFracos: "Pode ser temperamental, defensivo ou excessivamente apegado. Às vezes se fecha em si mesmo e guarda mágoas por muito tempo."
      },
      leao: {
        nome: "Leão", glifo: "♌", periodo: "23 de julho a 22 de agosto",
        elemento: "Fogo", modalidade: "Fixo", planeta: "Sol",
        descricao: "Leão irradia confiança, criatividade e generosidade. Pessoas de Leão gostam de brilhar, inspirar e serem reconhecidas. Possuem presença marcante e um coração generoso.",
        caracteristicas: ["Confiante", "Criativo", "Generoso", "Carismático", "Orgulloso", "Leal"],
        pontosFortes: "Liderança natural, calor humano e capacidade de motivar.",
        pontosFracos: "Pode ser vaidoso, dramático ou excessivamente centrado em si. Tem dificuldade em aceitar quando não é o centro das atenções."
      },
      virgem: {
        nome: "Virgem", glifo: "♍", periodo: "23 de agosto a 22 de setembro",
        elemento: "Terra", modalidade: "Mutável", planeta: "Mercúrio",
        descricao: "Virgem busca a excelência através da análise, organização e serviço. São pessoas detalhistas, práticas e prestativas, que gostam de melhorar tudo ao seu redor.",
        caracteristicas: ["Analítico", "Organizado", "Perfeccionista", "Prestativo", "Discreto", "Prático"],
        pontosFortes: "Atenção aos detalhes, eficiência e senso de utilidade.",
        pontosFracos: "Pode ser crítico demais, ansioso ou excessivamente exigente. Às vezes se cobra tanto que acaba se cobrando dos outros também."
      },
      libra: {
        nome: "Libra", glifo: "♎", periodo: "23 de setembro a 22 de outubro",
        elemento: "Ar", modalidade: "Cardinal", planeta: "Vênus",
        descricao: "Libra busca equilíbrio, harmonia e justiça nas relações. São pessoas diplomáticas, elegantes e sociáveis, que valorizam a parceria e a beleza em todas as formas.",
        caracteristicas: ["Diplomático", "Justo", "Elegante", "Sociável", "Indeciso", "Charmoso"],
        pontosFortes: "Habilidade de mediar conflitos e criar harmonia.",
        pontosFracos: "Pode evitar confrontos e ter dificuldade em decidir. Às vezes coloca a opinião dos outros acima da própria vontade."
      },
      escorpiao: {
        nome: "Escorpião", glifo: "♏", periodo: "23 de outubro a 21 de novembro",
        elemento: "Água", modalidade: "Fixo", planeta: "Plutão / Marte",
        descricao: "Escorpião é intenso, profundo e transformador. Pessoas de Escorpião possuem grande força emocional, lealdade e capacidade de regeneração. Valorizam a verdade e a intimidade genuína.",
        caracteristicas: ["Intenso", "Misterioso", "Leal", "Apaixonado", "Determinado", "Perceptivo"],
        pontosFortes: "Resiliência, profundidade emocional e foco.",
        pontosFracos: "Pode ser ciumento, vingativo ou excessivamente controlador. Tem dificuldade em perdoar e às vezes guarda rancor."
      },
      sagitario: {
        nome: "Sagitário", glifo: "♐", periodo: "22 de novembro a 21 de dezembro",
        elemento: "Fogo", modalidade: "Mutável", planeta: "Júpiter",
        descricao: "Sagitário é o signo da expansão, da aventura e da busca por significado. Pessoas de Sagitário são otimistas, honestas e amantes da liberdade e do conhecimento.",
        caracteristicas: ["Aventureiro", "Otimista", "Filosófico", "Honesto", "Independente", "Entusiasta"],
        pontosFortes: "Visão ampla, sinceridade e sede de aprender.",
        pontosFracos: "Pode ser imprudente, excessivamente direto ou inquieto. Às vezes fala a verdade de forma muito brusca e tem dificuldade em se comprometer."
      },
      capricornio: {
        nome: "Capricórnio", glifo: "♑", periodo: "22 de dezembro a 19 de janeiro",
        elemento: "Terra", modalidade: "Cardinal", planeta: "Saturno",
        descricao: "Capricórnio representa ambição, responsabilidade e construção a longo prazo. São pessoas disciplinadas, pacientes e focadas em resultados concretos e status merecido.",
        caracteristicas: ["Ambicioso", "Disciplinado", "Responsável", "Paciente", "Prático", "Reservado"],
        pontosFortes: "Persistência, maturidade e capacidade de alcançar metas.",
        pontosFracos: "Pode ser rígido, pessimista ou excessivamente focado no trabalho. Às vezes esquece de aproveitar o momento presente e ser mais leve."
      },
      aquario: {
        nome: "Aquário", glifo: "♒", periodo: "20 de janeiro a 18 de fevereiro",
        elemento: "Ar", modalidade: "Fixo", planeta: "Urano / Saturno",
        descricao: "Aquário é inovador, humanitário e independente. Pessoas de Aquário valorizam a liberdade, a originalidade e as causas coletivas. Pensam de forma diferente e gostam de quebrar padrões.",
        caracteristicas: ["Inovador", "Independente", "Humanitário", "Original", "Intelectual", "Livre"],
        pontosFortes: "Visão de futuro, imparcialidade e criatividade social.",
        pontosFracos: "Pode parecer distante, teimoso ou rebelde sem causa. Tem dificuldade em lidar com emoções intensas e pode ser imprevisível."
      },
      peixes: {
        nome: "Peixes", glifo: "♓", periodo: "19 de fevereiro a 20 de março",
        elemento: "Água", modalidade: "Mutável", planeta: "Netuno / Júpiter",
        descricao: "Peixes é o signo da empatia, da imaginação e da conexão espiritual. Pessoas de Peixes são sensíveis, criativas e compassivas, com forte intuição e capacidade de se colocar no lugar do outro.",
        caracteristicas: ["Empático", "Criativo", "Intuitivo", "Compassivo", "Sonhador", "Sensível"],
        pontosFortes: "Compaixão, imaginação e sensibilidade artística.",
        pontosFracos: "Pode ser escapista, indeciso ou excessivamente idealista. Às vezes se perde em fantasias e tem dificuldade em colocar os pés no chão."
      }
    };

    function obterSigno(mes, dia) {
      if ((mes === 3 && dia >= 21) || (mes === 4 && dia <= 19)) return "aries";
      if ((mes === 4 && dia >= 20) || (mes === 5 && dia <= 20)) return "touro";
      if ((mes === 5 && dia >= 21) || (mes === 6 && dia <= 20)) return "gemeos";
      if ((mes === 6 && dia >= 21) || (mes === 7 && dia <= 22)) return "cancer";
      if ((mes === 7 && dia >= 23) || (mes === 8 && dia <= 22)) return "leao";
      if ((mes === 8 && dia >= 23) || (mes === 9 && dia <= 22)) return "virgem";
      if ((mes === 9 && dia >= 23) || (mes === 10 && dia <= 22)) return "libra";
      if ((mes === 10 && dia >= 23) || (mes === 11 && dia <= 21)) return "escorpiao";
      if ((mes === 11 && dia >= 22) || (mes === 12 && dia <= 21)) return "sagitario";
      if ((mes === 12 && dia >= 22) || (mes === 1 && dia <= 19)) return "capricornio";
      if ((mes === 1 && dia >= 20) || (mes === 2 && dia <= 18)) return "aquario";
      if ((mes === 2 && dia >= 19) || (mes === 3 && dia <= 20)) return "peixes";
      return null;
    }

    function formatarData(iso) {
      var partes = iso.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    document.getElementById("btnRevelar").addEventListener("click", function () {
      var input = document.getElementById("nascimento");
      var data = input.value;
      var caixa = document.getElementById("resultado");

      if (!data) {
        caixa.innerHTML = '<p class="erro">Por favor, selecione sua data de nascimento.</p>';
        caixa.classList.add("ativo");
        return;
      }

      var partes = data.split("-");
      var mes = parseInt(partes[1], 10);
      var dia = parseInt(partes[2], 10);
      var chave = obterSigno(mes, dia);

      if (!chave || !signos[chave]) {
        caixa.innerHTML = '<p class="erro">Não foi possível determinar o signo para esta data.</p>';
        caixa.classList.add("ativo");
        return;
      }

      var s = signos[chave];
      var tags = "";
      for (var i = 0; i < s.caracteristicas.length; i++) {
        tags += '<span class="trait">' + s.caracteristicas[i] + '</span>';
      }

      caixa.innerHTML =
        '<div class="resultado-header">' +
          '<div class="glyph">' + s.glifo + '</div>' +
          '<h2>' + s.nome + '</h2>' +
          '<p class="periodo">' + s.periodo + '</p>' +
        '</div>' +
        '<p class="data-nasc">Data informada: <strong>' + formatarData(data) + '</strong></p>' +
        '<div class="badges">' +
          '<span class="badge">Elemento: ' + s.elemento + '</span>' +
          '<span class="badge">Modalidade: ' + s.modalidade + '</span>' +
          '<span class="badge">Planeta: ' + s.planeta + '</span>' +
        '</div>' +
        '<div class="section">' +
          '<h3>Sobre o signo</h3>' +
          '<p>' + s.descricao + '</p>' +
        '</div>' +
        '<div class="section">' +
          '<h3>Principais características</h3>' +
          '<div class="traits">' + tags + '</div>' +
        '</div>' +
        '<div class="section">' +
          '<h3>Pontos fortes</h3>' +
          '<p>' + s.pontosFortes + '</p>' +
        '</div>' +
        '<div class="section">' +
          '<h3>Pontos fracos</h3>' +
          '<div class="fracos"><p>' + s.pontosFracos + '</p></div>' +
        '</div>';

      caixa.classList.add("ativo");

      setTimeout(function () {
        caixa.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 100);
    });

    var inputData = document.getElementById("nascimento");
    var hoje = new Date().toISOString().split("T")[0];
    inputData.setAttribute("max", hoje);
    inputData.setAttribute("min", "1900-01-01");
  </script>
</body>
</html>
